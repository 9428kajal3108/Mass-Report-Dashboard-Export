<template>
    <div class="export-bar">
        <div class="export-bar__inner">

            <!-- Selected count badge -->
            <span class="slds-badge slds-badge_lightest count-badge">
                <lightning-icon icon-name="utility:check" size="xx-small"
                    class="slds-var-m-right_xx-small"></lightning-icon>
                {selectedLabel}
            </span>

            <!-- Format selector -->
            <div class="format-select-wrap">
                <lightning-combobox
                    name="exportFormat"
                    label="Format"
                    variant="label-hidden"
                    value={selectedFormat}
                    options={formatOptions}
                    onchange={handleFormatChange}>
                </lightning-combobox>
            </div>

            <!-- Export button -->
            <div class="export-btn-wrap">
                <lightning-button
                    label={exportButtonLabel}
                    variant="brand"
                    icon-name="utility:download"
                    icon-position="left"
                    disabled={isExportDisabled}
                    onclick={handleExport}>
                </lightning-button>
                <template if:true={isExporting}>
                    <lightning-spinner
                        alternative-text="Exporting..."
                        size="small"
                        class="slds-var-m-left_x-small">
                    </lightning-spinner>
                </template>
            </div>

            <!-- Limit warning -->
            <template if:true={showLimitWarning}>
                <div class="limit-warning-wrap">
                    <lightning-icon icon-name="utility:warning" size="x-small"
                        class="slds-var-m-right_xx-small"></lightning-icon>
                    <span class="slds-text-body_small">Max 50 reports. Only first 50 will be exported.</span>
                </div>
            </template>
        </div>
    </div>
</template>
