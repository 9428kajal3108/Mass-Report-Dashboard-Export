<template>
    <lightning-card icon-name={cardIconName} title={cardTitle}>
        <div slot="actions" class="card-actions">
            <!-- Total count & page info -->
            <template if:true={hasResults}>
                <span class="result-badge slds-badge">{totalCountLabel}</span>
                <span class="page-info slds-text-body_small slds-text-color_weak">
                    Page {currentPage} of {totalPages}
                </span>
            </template>
        </div>

        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">

            <!-- ── 2:1 GRID: TABLE (left) + EXPORT PANEL (right) ── -->
            <div class="report-section-grid">

                <!-- ── LEFT: Table & Pagination ── -->
                <div class="table-pane">

                    <!-- LOADING -->
                    <template if:true={isLoading}>
                        <div class="state-container">
                            <lightning-spinner alternative-text={loadingLabel} size="medium"></lightning-spinner>
                            <p class="slds-text-body_small slds-text-color_weak state-text">{loadingLabel}</p>
                        </div>
                    </template>

                    <!-- ERROR -->
                    <template if:true={hasError}>
                        <div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
                            <lightning-icon icon-name="utility:error" size="x-small"
                                class="slds-var-m-right_x-small"></lightning-icon>
                            <span>{searchResult.errorMessage}</span>
                        </div>
                    </template>

                    <!-- EMPTY STATE -->
                    <template if:true={isEmpty}>
                        <div class="state-container empty-state">
                            <lightning-icon icon-name={emptyStateIcon} size="large"
                                class="slds-var-m-bottom_small empty-icon"></lightning-icon>
                            <p class="slds-text-heading_small empty-title">{emptyStateTitle}</p>
                            <p class="slds-text-body_small slds-text-color_weak">{emptyStateSubtitle}</p>
                        </div>
                    </template>

                    <!-- RESULTS TABLE -->
                    <template if:true={hasResults}>

                        <!-- Quick search -->
                        <div class="quick-search-row">
                            <div class="quick-search-input">
                                <lightning-input
                                    type="search"
                                    label="Quick Search"
                                    variant="label-hidden"
                                    placeholder={quickSearchPlaceholder}
                                    value={quickSearchTerm}
                                    onchange={handleQuickSearch}>
                                </lightning-input>
                            </div>
                            <template if:true={isQuickFiltered}>
                                <span class="slds-text-body_small slds-text-color_weak quick-filter-count">
                                    Showing {filteredRecords.length} of {searchResult.records.length}
                                </span>
                            </template>
                        </div>

                        <!-- Select-all-across-pages banner -->
                        <template if:true={showSelectAllBanner}>
                            <div class="slds-notify slds-notify_alert slds-theme_info select-all-banner"
                                 role="status">
                                <lightning-icon icon-name="utility:info" size="x-small"
                                    class="slds-var-m-right_x-small"></lightning-icon>
                                <template if:false={selectAllAcrossPages}>
                                    All <strong>{pageSize}</strong> records on this page are selected.
                                    <a href="javascript:void(0)" onclick={handleSelectAllAcrossPages}
                                       class="slds-var-m-left_x-small select-all-link">
                                        Select all {searchResult.totalCount} records in this search
                                    </a>
                                </template>
                                <template if:true={selectAllAcrossPages}>
                                    All <strong>{searchResult.totalCount}</strong> records are selected.
                                    <a href="javascript:void(0)" onclick={handleClearAllSelection}
                                       class="slds-var-m-left_x-small select-all-link">
                                        Clear selection
                                    </a>
                                </template>
                            </div>
                        </template>

                        <!-- Data table -->
                        <div class="datatable-container">
                            <lightning-datatable
                                key-field="id"
                                data={filteredRecords}
                                columns={columns}
                                selected-rows={selectedRowIds}
                                sorted-by={sortField}
                                sorted-direction={sortDirection}
                                default-sort-direction="asc"
                                onrowselection={handleRowSelection}
                                onsort={handleSort}
                                suppress-bottom-bar>
                            </lightning-datatable>
                        </div>

                        <!-- Pagination footer -->
                        <div class="table-pagination-footer">
                            <div class="pagination-left-corner">
                                <span class="slds-text-body_small slds-var-m-right_x-small">View</span>
                                <lightning-combobox
                                    name="pageSize"
                                    label="Page Size"
                                    variant="label-hidden"
                                    value={pageSizeStr}
                                    options={pageSizeOptions}
                                    class="page-size-select"
                                    onchange={handlePageSizeChange}>
                                </lightning-combobox>
                                <span class="slds-text-body_small slds-var-m-left_x-small">per page</span>
                            </div>

                            <div class="pagination-center">
                                <lightning-button-group>
                                    <lightning-button
                                        label="&#171; First"
                                        disabled={isFirstPage}
                                        onclick={goFirst}>
                                    </lightning-button>
                                    <lightning-button
                                        label="&#8249; Prev"
                                        disabled={isFirstPage}
                                        onclick={goPrev}>
                                    </lightning-button>
                                    <lightning-button
                                        label="Next &#8250;"
                                        disabled={isLastPage}
                                        onclick={goNext}>
                                    </lightning-button>
                                    <lightning-button
                                        label="Last &#187;"
                                        disabled={isLastPage}
                                        onclick={goLast}>
                                    </lightning-button>
                                </lightning-button-group>
                            </div>

                            <div class="pagination-right-balance">
                                <!-- Balance spacer -->
                            </div>
                        </div>

                    </template>
                </div>

                <!-- ── RIGHT: Export Panel ── -->
                <div class="export-pane">
                    <slot name="export-toolbar"></slot>
                </div>

            </div>
        </div>
    </lightning-card>
</template>
