<template>
    <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-center filter-row">

        <!-- Field selector -->
        <div class="slds-col filter-field-col">
            <lightning-combobox
                name="field"
                label="Field"
                variant="label-hidden"
                placeholder="Select Field..."
                value={condition.field}
                options={fieldOptions}
                onchange={handleFieldChange}>
            </lightning-combobox>
        </div>

        <!-- Operator selector -->
        <div class="slds-col filter-operator-col">
            <lightning-combobox
                name="operator"
                label="Operator"
                variant="label-hidden"
                placeholder="Operator..."
                value={condition.operator}
                options={operatorOptions}
                disabled={isOperatorDisabled}
                onchange={handleOperatorChange}>
            </lightning-combobox>
        </div>

        <!-- Value input -->
        <div class="slds-col filter-value-col">
            <template if:false={isValueHidden}>
                <lightning-input
                    name="value"
                    label="Value"
                    variant="label-hidden"
                    placeholder={valuePlaceholder}
                    value={condition.value}
                    onchange={handleValueChange}>
                </lightning-input>
            </template>
            <template if:true={isValueHidden}>
                <div class="no-value-placeholder">No value needed</div>
            </template>
        </div>

        <!-- Remove button — hidden when this is the only row -->
        <div class="slds-col slds-no-flex filter-action-col">
            <template if:false={isOnlyRow}>
                <lightning-button-icon
                    icon-name="utility:delete"
                    variant="border-filled"
                    alternative-text="Remove condition"
                    title="Remove this condition"
                    size="small"
                    onclick={handleRemove}>
                </lightning-button-icon>
            </template>
            <!-- Reserve space so columns don't shift when button is hidden -->
            <template if:true={isOnlyRow}>
                <div class="remove-placeholder"></div>
            </template>
        </div>

    </div>
</template>
