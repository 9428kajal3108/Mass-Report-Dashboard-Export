<template>
    <lightning-card icon-name={cardIconName} title={cardTitle}>
        <div slot="actions">
            <!-- Mode toggle: Condition Builder | Raw SOQL -->
            <lightning-button-group>
                <lightning-button
                    label="Condition Builder"
                    variant={builderVariant}
                    onclick={switchToBuilder}>
                </lightning-button>
                <lightning-button
                    label="Raw SOQL"
                    variant={rawVariant}
                    onclick={switchToRaw}>
                </lightning-button>
            </lightning-button-group>
        </div>

        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">

            <!-- ── CONDITION BUILDER MODE ── -->
            <template if:true={isBuilderMode}>
                <div class="conditions-container">

                    <!-- Each condition block: optional join badge above + filter row -->
                    <template for:each={conditionsWithMeta} for:item="cond">
                        <div key={cond.id} class="condition-block">

                            <!-- AND / OR join badge between rows (not before the first) -->
                            <template if:true={cond.showJoin}>
                                <div class="join-badge-row">
                                    <div class="join-badge-line"></div>
                                    <lightning-button-group class="join-badge-group">
                                        <lightning-button
                                            label="AND"
                                            variant={andVariant}
                                            onclick={setAndLogic}>
                                        </lightning-button>
                                        <lightning-button
                                            label="OR"
                                            variant={orVariant}
                                            onclick={setOrLogic}>
                                        </lightning-button>
                                    </lightning-button-group>
                                    <div class="join-badge-line"></div>
                                </div>
                            </template>

                            <!-- Filter row (field / operator / value / remove) -->
                            <c-filter-row
                                row-index={cond.idx}
                                fields={fields}
                                condition={cond}
                                is-only-row={cond.isOnly}
                                onconditionchange={handleConditionChange}
                                onconditionremove={handleConditionRemove}>
                            </c-filter-row>
                        </div>
                    </template>

                    <!-- Standalone Add Condition button below all rows -->
                    <div class="add-condition-row">
                        <lightning-button
                            label="Add Condition"
                            variant="neutral"
                            icon-name="utility:add"
                            onclick={addCondition}>
                        </lightning-button>
                    </div>
                </div>
            </template>

            <!-- ── RAW SOQL MODE ── -->
            <template if:true={isRawMode}>
                <div class="slds-form-element">
                    <label class="slds-form-element__label" for="rawSoql">
                        <abbr class="slds-required" title="required">*</abbr>
                        Raw SOQL
                    </label>
                    <div class="slds-form-element__control">
                        <textarea
                            id="rawSoql"
                            class="slds-textarea soql-textarea"
                            placeholder={soqlPlaceholder}
                            value={rawSOQL}
                            oninput={handleRawSOQLInput}>
                        </textarea>
                    </div>
                </div>

                <!-- Validation feedback -->
                <template if:true={validationError}>
                    <div class="slds-notify slds-notify_alert slds-theme_error slds-var-m-top_x-small"
                         role="alert">
                        <lightning-icon icon-name="utility:error" size="x-small"
                            class="slds-var-m-right_x-small"></lightning-icon>
                        <span>{validationError}</span>
                    </div>
                </template>
                <template if:true={isValidated}>
                    <div class="slds-notify slds-notify_alert slds-theme_success slds-var-m-top_x-small"
                         role="alert">
                        <lightning-icon icon-name="utility:success" size="x-small"
                            class="slds-var-m-right_x-small"></lightning-icon>
                        <span>SOQL is valid. Click Search to load results.</span>
                    </div>
                </template>
            </template>

            <!-- ── ACTION BUTTONS — Search & Clear always side by side ── -->
            <div class="action-buttons-row">
                <div class="action-buttons-group">
                    <!-- Validate button only in raw mode -->
                    <template if:true={isRawMode}>
                        <lightning-button
                            label="Validate SOQL"
                            variant="neutral"
                            icon-name="utility:check"
                            disabled={isValidating}
                            onclick={handleValidate}>
                        </lightning-button>
                        <template if:true={isValidating}>
                            <lightning-spinner
                                alternative-text="Validating..."
                                size="small"
                                class="slds-var-m-left_x-small">
                            </lightning-spinner>
                        </template>
                    </template>

                    <!-- Search button -->
                    <lightning-button
                        label={searchButtonLabel}
                        variant="brand"
                        icon-name="utility:search"
                        disabled={isSearchDisabled}
                        onclick={handleSearch}>
                    </lightning-button>

                    <!-- Clear button — right next to Search -->
                    <lightning-button
                        label="Clear"
                        variant="neutral"
                        icon-name="utility:clear"
                        onclick={handleClear}>
                    </lightning-button>
                </div>
            </div>

        </div>
    </lightning-card>
</template>
