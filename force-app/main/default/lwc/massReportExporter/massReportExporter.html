<template>
    <div class="app-container">
        <!-- Header -->
        <div class="app-header slds-grid slds-align_absolute-center">
            <div class="slds-col">
                <h1 class="slds-text-heading_large">
                    <lightning-icon icon-name="standard:report" size="small"
                        class="slds-var-m-right_small"></lightning-icon>
                    {cardTitle}
                </h1>
                <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small">
                    Filter, select, and bulk-download Salesforce Reports/Dashbaord as Excel or CSV.
                </p>
            </div>
        </div>

        <!-- Filter Panel -->
        <div class="slds-var-m-bottom_medium">
            <c-filter-builder fields={reportFields} onsearchrequest={handleSearchRequest}
                onclearfilters={handleClearFilters}>
            </c-filter-builder>
        </div>

        <!-- Report Table + Export Toolbar (inside same card via slot) -->
        <c-report-data-table search-result={searchResult} is-loading={isSearching} page-size={pageSize}
            current-offset={currentOffset} onpagechange={handlePageChange} onselectionchange={handleSelectionChange}
            onselectallpages={handleSelectAllPages} lwc:ref="dataTable">

            <!-- Export toolbar slotted inside the card -->
            <c-export-toolbar slot="export-toolbar" selected-count={selectedCount} is-exporting={isExporting}
                onexportrequest={handleExportRequest}>
            </c-export-toolbar>
        </c-report-data-table>

    </div>
</template>
